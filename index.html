<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">
</head>

<body>

        <div id="Xscore">
            <p class="X">0</p>
            <p id="X">X</p>
        </div>
    </div>
    <h2 id="hide"></h2>
    <div class="container">
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
    </div>
    <div class="restart">
        <button class="newgame">New game</button>
        <button class="restartgame">Restart game</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
